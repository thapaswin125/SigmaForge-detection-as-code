title: Remote Process Creation Via WMI
id: 4aaced56-b2b3-4788-8c01-23eec93ad847
status: experimental
description: |
    Detects process execution over WMI from two directions: wmic.exe
    invoked with /node: and "process call create" to launch a process on a
    remote host, and a command interpreter or script host spawned locally
    by WmiPrvSE.exe, which is what an inbound WMI execution looks like on
    the receiving end. WMI is a favoured lateral movement channel because
    it needs no file drop and no new service. Observed via Sysmon Event ID 1.
references:
    - https://attack.mitre.org/techniques/T1047/
    - https://attack.mitre.org/techniques/T1021/
author: SigmaForge
date: 2026-08-17
tags:
    - attack.lateral-movement
    - attack.execution
    - attack.t1047
logsource:
    product: windows
    category: process_creation
detection:
    selection_wmic_node:
        Image|endswith: '\wmic.exe'
        CommandLine|contains: '/node:'
    selection_wmic_create:
        CommandLine|contains: 'process call create'
    selection_wmiprvse_child:
        ParentImage|endswith: '\WmiPrvSE.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
    condition: (selection_wmic_node and selection_wmic_create) or selection_wmiprvse_child
falsepositives:
    - Software deployment and patch management suites that use WMI to
      trigger installs on remote endpoints
    - Monitoring agents whose WMI providers shell out to PowerShell for
      collection scripts; baseline the specific parent-child pair per product
    - Administrators using wmic process call create instead of PsExec for
      one-off remote tasks
level: high
