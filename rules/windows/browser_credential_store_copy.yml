title: Browser Credential Store Accessed By A Copy Or Database Utility
id: a16a6dfc-1dc1-496c-8ed4-154d38e80205
status: experimental
description: |
    Detects a general purpose copy, archive, or database utility touching a
    browser credential store: the Chromium Login Data and Cookies
    databases, or the Firefox logins.json and key4.db pair. The browser
    reading its own credential store is normal; esentutl, robocopy, tar, or
    PowerShell reading it is credential theft staging. esentutl in
    particular is favoured because it can copy a file the browser holds
    open. Observed via Sysmon Event ID 1.
references:
    - https://attack.mitre.org/techniques/T1555/003/
    - https://attack.mitre.org/techniques/T1539/
author: SigmaForge
date: 2026-08-17
tags:
    - attack.credential-access
    - attack.collection
    - attack.t1555.003
    - attack.t1539
logsource:
    product: windows
    category: process_creation
detection:
    selection_tool:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\esentutl.exe'
            - '\robocopy.exe'
            - '\xcopy.exe'
            - '\tar.exe'
            - '\7z.exe'
            - '\rar.exe'
    selection_credential_store:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Default\Network\Cookies'
            - '\User Data\Local State'
            - '\logins.json'
            - '\key4.db'
            - '\cookies.sqlite'
    condition: selection_tool and selection_credential_store
falsepositives:
    - Endpoint backup and user-profile migration tooling that copies the
      whole browser profile directory, including the credential store
    - Browser support scripts that back up a profile before a repair
    - Forensic and IR collection tooling running with authorisation, which
      should be correlated against an open investigation
level: critical
