title: Process Launched By WinRM Remote Session Host
id: 1550f6e6-8115-4424-873c-ed7c95a65139
status: experimental
description: |
    Detects a process spawned by wsmprovhost.exe, the host process for
    inbound WinRM / PowerShell Remoting sessions. Any command interpreter
    or script host under wsmprovhost.exe means someone executed code on
    this machine over WinRM. That is a legitimate administration path, so
    the value of this rule is attribution rather than novelty: it tells you
    which host reached in and what it ran. Observed via Sysmon Event ID 1.
references:
    - https://attack.mitre.org/techniques/T1021/006/
    - https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/winrm-security
author: SigmaForge
date: 2026-08-17
tags:
    - attack.lateral-movement
    - attack.t1021.006
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\wsmprovhost.exe'
    filter_session_plumbing:
        Image|endswith:
            - '\conhost.exe'
            - '\WerFault.exe'
    condition: selection and not filter_session_plumbing
falsepositives:
    - Configuration management platforms (Ansible for Windows, DSC, SCCM
      remote actions) that drive endpoints over WinRM; these come from
      known management servers and should be scoped out by source host
    - Administrators using Enter-PSSession or Invoke-Command for routine
      support work
level: medium
