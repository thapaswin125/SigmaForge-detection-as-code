title: Shadow Copy Deletion Via Vssadmin Or Wmic
id: a9b85d73-2778-4717-8e0d-12f97852b235
status: experimental
description: |
    Detects deletion of volume shadow copies using vssadmin or wmic.
    Ransomware almost universally destroys shadow copies immediately before
    encryption to prevent file recovery, so this firing outside a known
    backup maintenance window deserves an immediate look. Observed via
    Sysmon Event ID 1 (process creation). Backup suites that prune shadow
    copies as part of retention management are filtered by parent process.
references:
    - https://attack.mitre.org/techniques/T1490/
    - https://redcanary.com/threat-detection-report/techniques/inhibit-system-recovery/
author: SigmaForge
date: 2026-07-14
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    filter_backup_software:
        ParentImage|startswith:
            - 'C:\Program Files\Veeam\'
            - 'C:\Program Files\Microsoft Data Protection Manager\'
            - 'C:\Program Files\Veritas\'
    condition: 1 of selection_* and not filter_backup_software
falsepositives:
    - Backup software deleting aged shadow copies during retention cleanup,
      runs from the vendor's service binary which is filtered
    - Administrators reclaiming disk space on storage-constrained servers,
      rare and worth a confirmation ping rather than a silent allow
level: high
