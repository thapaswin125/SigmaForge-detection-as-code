title: Office Application Spawning A Command Or Script Interpreter
id: 9cd8c5e9-b6b4-48ef-a19b-90dedfbf786a
status: experimental
description: |
    Detects a Microsoft Office application spawning a command interpreter,
    script host, or living-off-the-land download utility. This is the
    canonical shape of a malicious document: the user opens the attachment,
    the macro or embedded object runs, and Office becomes the parent of
    something that has no business being there. Office legitimately spawns
    printing and repair helpers, but not PowerShell. Observed via Sysmon
    Event ID 1.
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/
author: SigmaForge
date: 2026-08-17
tags:
    - attack.initial-access
    - attack.execution
    - attack.t1566.001
    - attack.t1204.002
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\OUTLOOK.EXE'
            - '\MSACCESS.EXE'
            - '\VISIO.EXE'
            - '\MSPUB.EXE'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\bitsadmin.exe'
            - '\certutil.exe'
            - '\curl.exe'
    condition: selection
falsepositives:
    - Enterprise document templates and add-ins that legitimately shell out,
      most often to cmd.exe or wscript.exe for data refresh; these are
      environment specific and should be allowlisted by document path
    - Mail merge and reporting workflows driven from Access or Excel macros
level: high
